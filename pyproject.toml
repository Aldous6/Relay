[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "routerbench-icd"
version = "0.8.1"
description = "Relay: routing experimental de LLMs y API de integración para harnesses"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.6,<2",
  "pyarrow>=17,<24",
]

[project.optional-dependencies]
notebooks = ["jupyterlab>=4,<5", "matplotlib>=3.9,<4", "seaborn>=0.13,<1"]
semantic = ["onnxruntime==1.31.1", "tokenizers==0.23.3"]
demo = ["streamlit==1.52.2"]
api = ["litellm==1.109.1"]
bfcl = ["mpmath==1.3.0", "tiktoken==0.14.0", "jinja2==3.1.6"]

[project.scripts]
routerbench-icd = "routerbench.cli:main"
routerbench-develop = "routerbench.development:main"
routerbench-recommend = "routerbench.recommend:main"
relay-maintain = "relay_router.maintenance_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
